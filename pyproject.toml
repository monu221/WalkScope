[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "walkscope"
version = "0.1.0"
description = "Street-by-street walkability scores from OpenStreetMap, per persona."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "osmnx>=2.0",
    "networkx>=3.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "streamlit>=1.67",
    "folium>=0.15",
    "branca>=0.7",
    "jinja2>=3.1",
    "streamlit-folium>=0.20",
    "fpdf2>=2.7",
    "pillow>=10.1",
    "pyyaml>=6.0",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Nominatim/Overpass APIs (run with: pytest -m live)"]
