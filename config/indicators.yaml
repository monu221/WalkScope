# Thresholds, defaults and tag mappings for the five indicators.
# Every rule here is described in docs/method.md. Change numbers here, not in code.

area:
  buffer_m: 1000             # download this much around the study area; score only inside it.
                             # At least the furthest reach used (transit.rail_station.zero_score_m).
  max_km2: 5                 # larger areas are refused (download time and server load)

walking:
  speed_kmh: 4.8             # kept for later versions; not used in v1

pedestrian_only_highways: [footway, pedestrian, path, steps]

# Segments that stay in the graph for walking distances but are not scored or
# shown. A segment is routing-only if, for any tag below, it has that tag and
# every value of it is in the list (merged segments that are partly something
# else stay scored).
# - footway: a road's sidewalk or crossing (only for pedestrian-only segments);
#   the road it belongs to carries its quality.
# - service: parking aisles and driveways, not streets people walk along.
# - access: private ways.
# - highway: indoor corridors.
routing_only:
  footway: [sidewalk, crossing, traffic_island]
  service: [parking_aisle, driveway]
  access: [private]
  highway: [corridor]

amenity:
  # Each category scores by the walking distance to its nearest point: 100 within
  # full_score_m, falling linearly to 0 at zero_score_m (a 10-minute walk).
  # The amenity score is the average of the category scores.
  full_score_m: 200
  zero_score_m: 800
  categories:
    groceries:
      shop: [supermarket, convenience, greengrocer, bakery, butcher]
    school:
      amenity: [school]
    pharmacy:
      amenity: [pharmacy]
    park:
      leisure: [park, playground]
    cafe:
      amenity: [cafe]
    doctor:
      amenity: [doctors, clinic]

connectivity:
  radius_m: 400              # straight-line radius around the measuring node
  min_street_count: 3        # a node is an intersection if this many streets meet
  # Streets for counting intersections: never routing-only segments; footways,
  # paths etc. only if this is true. With them, footway meshes in parks and
  # courtyards push most city segments far past density_full (see method.md).
  count_pedestrian_only: false
  density_zero: 30           # intersections per km² that score 0
  density_full: 150          # intersections per km² that score 100

infrastructure:
  base_mix:                  # for segments that are not pedestrian-only
    sidewalk: 60
    crossing: 40
  pedestrian_only_base: 100
  missing_score: 50          # used for any missing sidewalk / kerb / surface / lit tag
  sidewalk:
    both: 100
    separate: 100
    left: 60
    right: 60
    "no": 0
    none: 0
  # Used when `sidewalk` is missing: sidewalk:left / sidewalk:right (each
  # falling back to sidewalk:both). Both sides present -> both, one side ->
  # left/right, both absent -> no, otherwise unknown.
  sidewalk_sides:
    present: ["yes", separate]
    absent: ["no", none]
  crossing:
    search_radius_m: 50
    marked_values: [marked, zebra, traffic_signals, uncontrolled]
    ignored_values: ["no", informal]   # not a crossing: no crossing possible / not designated
    marked_score: 100
    unmarked_score: 50
    none_score: 0
  kerb:
    search_radius_m: 50      # worst kerb within this distance of the segment
    values:
      flush: 100
      lowered: 100
      "no": 100
      rolled: 50
      raised: 0
  surface:
    tags: ["sidewalk:surface", surface]   # first one present is used
    values:
      paved: 100
      asphalt: 100
      concrete: 100
      "concrete:plates": 100
      paving_stones: 100
      compacted: 60
      fine_gravel: 60
      sett: 30
      cobblestone: 30
      unhewn_cobblestone: 30
      unpaved: 0
      gravel: 0
      dirt: 0
      ground: 0
      grass: 0
      sand: 0
      mud: 0
  lit:
    values:
      "yes": 100
      "24/7": 100
      automatic: 100
      "no": 0

traffic_stress:
  pedestrian_only_score: 100
  # Speed score is linear between these [km/h, score] points, clipped outside.
  speed_curve:
    - [10, 100]
    - [30, 75]
    - [50, 30]
    - [70, 0]
  # Road class as a stand-in for traffic volume: the speed score is multiplied
  # by this factor before the lane penalty. `_link` roads use their parent
  # class; a merged segment uses its lowest factor; unlisted classes
  # (residential, living_street, service, ...) use 1.0.
  # Pedestrian-only segments score pedestrian_only_score regardless.
  class_factor:
    trunk: 0.5
    primary: 0.6
    secondary: 0.7
    tertiary: 0.85
    unclassified: 0.9
  lanes_free: 2              # no penalty up to this many lanes
  lane_penalty: 10           # points off for each lane above lanes_free
  # Used when maxspeed is missing. German urban defaults by road class, except
  # residential: 30, because 85-100 % of tagged residential streets in the test
  # areas are 30 km/h or lower (evidence in docs/method.md).
  default_speed_kmh:
    trunk: 70
    primary: 50
    secondary: 50
    tertiary: 50
    unclassified: 50
    residential: 30
    service: 30
    living_street: 7
    track: 30
    other: 50
  # Non-numeric maxspeed values.
  maxspeed_aliases:
    "DE:urban": 50
    "DE:zone30": 30
    "DE:zone:30": 30
    "DE:zone20": 20
    "DE:zone:20": 20
    "DE:living_street": 7
    "DE:rural": 100
    walk: 7

transit:
  # Score = the better of the two below. Distances are walked along the network.
  stop:                      # any bus, tram or rail stop
    full_score_m: 150        # 100 points within this walking distance
    zero_score_m: 800        # 0 points at and beyond this distance
  rail_station:              # rail, U-Bahn or S-Bahn station: worth a longer walk
    full_score_m: 300
    zero_score_m: 1000
  # Stops carrying any of these tags count as rail stations. U-Bahn and S-Bahn
  # stations are railway=station too (with station=subway / light_rail).
  rail_station_tags:
    railway: [station, halt]
  # Everything downloaded as a transit stop.
  stop_tags:
    highway: [bus_stop]
    public_transport: [platform, stop_position, station]
    railway: [station, halt, tram_stop]
